</html><style>body { margin: 0; background: #020205; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }

/* Estilo para el Top 1 */

}</style><script>const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const menu = document.getElementById('menu');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let score = 0, level = 1, lives = 3, playerName = "", topPlayerName = "";
let obstacles = [], enemies = [], particles = [], stars = [];
let ball = { x: 0, y: 0, radius: 10, vx: 0, vy: 0, friction: 0.98, active: false, startX: 0, startY: 0, history: [] };
let hole = { x: 0, y: 0, radius: 20, angle: 0 };
let isDragging = false, startTouch = { x: 0, y: 0 }, currentTouch = { x: 0, y: 0 };
let bgHue = 260, gameOverAnim = false;
const MAX_DRAG_DIST = 150; // Distancia máxima de arrastre (Fuerza límite)

// --- PERSISTENCIA SEGURA ---
window.onload = () => {
    try {
        const savedName = localStorage.getItem('novaBall_name');
        const savedPass = localStorage.getItem('novaBall_pass');
        if (savedName && savedPass) {
            document.getElementById('nameInput').value = savedName;
            document.getElementById('passInput').value = savedPass;
        }
    } catch (e) { console.warn("Almacenamiento local desactivado"); }
};

// --- FONDO ---
for(let i=0; i<80; i++) {
    stars.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*2, op: Math.random()});
}

function createParticles(x, y, color, count = 10, speed = 3) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: x, y: y, 
            vx: (Math.random()-0.5)*speed, vy: (Math.random()-0.5)*speed,
            life: 1.0, color: color, size: Math.random()*3 + 1
        });
    }
}

function updateRanking() {
    db.ref('users').orderByChild('score').limitToLast(5).on('value', (snapshot) => {
        const list = document.getElementById('rankList');
        if (!list) return;
        list.innerHTML = "";
        let leaders = [];
        snapshot.forEach((child) => {
            leaders.push({ name: child.key, score: child.val().score });
        });
        leaders.reverse().forEach((p, i) => {
            if(i === 0) topPlayerName = p.name;
            const item = document.createElement('div');
            item.className = 'rank-item';
            const nameClass = (i === 0) ? 'rank-top1' : '';
            item.innerHTML = `<span class="${nameClass}">${i === 0 ? '🏆 ' : ''}${i + 1}. ${p.name}</span><span style="color:#a855f7">${p.score}</span>`;
            list.appendChild(item);
        });
    });
}

// --- GENERADOR DE LABERINTO ESTRUCTURADO (TIPO IMAGEN) ---
function generateMaze() {
    obstacles = []; enemies = [];
    // Ajustar tamaño de celda según nivel (más difícil = más estrecho)
    const cellSize = Math.max(60, 100 - (level * 5));
    const cols = Math.floor(canvas.width / cellSize);
    const rows = Math.floor(canvas.height / cellSize);
    const wallThick = 6;

    // Crear rejilla llena de muros
    let grid = [];
    for(let c=0; c<cols; c++) {
        grid[c] = [];
        for(let r=0; r<rows; r++) {
            grid[c][r] = { top: true, right: true, bottom: true, left: true, visited: false };
        }
    }

    // Algoritmo DFS (Depth-First Search) para crear caminos perfectos
    let stack = [];
    let current = {c: 0, r: 0};
    grid[0][0].visited = true;
    
    // Función auxiliar para obtener vecinos no visitados
    function checkNeighbors(c, r) {
        let neighbors = [];
        if (c > 0 && !grid[c-1][r].visited) neighbors.push({c: c-1, r: r, dir: 'left'});
        if (c < cols-1 && !grid[c+1][r].visited) neighbors.push({c: c+1, r: r, dir: 'right'});
        if (r > 0 && !grid[c][r-1].visited) neighbors.push({c: c, r: r-1, dir: 'top'});
        if (r < rows-1 && !grid[c][r+1].visited) neighbors.push({c: c, r: r+1, dir: 'bottom'});
        if (neighbors.length > 0) return neighbors[Math.floor(Math.random() * neighbors.length)];
        return undefined;
    }

    do {
        let next = checkNeighbors(current.c, current.r);
        if (next) {
            stack.push(current);
            // Romper paredes
            if (next.dir === 'top') { grid[current.c][current.r].top = false; grid[next.c][next.r].bottom = false; }
            if (next.dir === 'right') { grid[current.c][current.r].right = false; grid[next.c][next.r].left = false; }
            if (next.dir === 'bottom') { grid[current.c][current.r].bottom = false; grid[next.c][next.r].top = false; }
            if (next.dir === 'left') { grid[current.c][current.r].left = false; grid[next.c][next.r].right = false; }
            
            grid[next.c][next.r].visited = true;
            current = next;
        } else if (stack.length > 0) {
            current = stack.pop();
        }
    } while (stack.length > 0);

    // Convertir grid a obstáculos
    for(let c=0; c<cols; c++) {
        for(let r=0; r<rows; r++) {
            let x = c * cellSize;
            let y = r * cellSize;
            // Solo dibujamos paredes Right y Bottom para evitar duplicados (más el borde exterior)
            if (grid[c][r].right) obstacles.push({x: x + cellSize - wallThick, y: y, w: wallThick, h: cellSize});
            if (grid[c][r].bottom) obstacles.push({x: x, y: y + cellSize - wallThick, w: cellSize, h: wallThick});
        }
    }
    // Bordes exteriores sólidos
    obstacles.push({x:0, y:0, w:canvas.width, h:wallThick}); // Arriba
    obstacles.push({x:0, y:0, w:wallThick, h:canvas.height}); // Izquierda
    obstacles.push({x:canvas.width-wallThick, y:0, w:wallThick, h:canvas.height}); // Derecha
    obstacles.push({x:0, y:canvas.height-wallThick, w:canvas.width, h:wallThick}); // Abajo

    // Posicionar jugador y meta en esquinas opuestas
    ball.x = cellSize / 2; ball.y = cellSize / 2;
    ball.startX = ball.x; ball.startY = ball.y;
    ball.active = true; ball.vx = 0; ball.vy = 0; ball.history = [];
    
    hole.x = (cols * cellSize) - (cellSize / 2);
    hole.y = (rows * cellSize) - (cellSize / 2);
    // Asegurar que el hoyo no esté fuera de pantalla si el grid no es exacto
    hole.x = Math.min(hole.x, canvas.width - 40);
    hole.y = Math.min(hole.y, canvas.height - 40);

    // Enemigos seguros
    let eCount = Math.min(2 + Math.floor(level/2), 5);
    for(let i=0; i<eCount; i++) {
        let ex, ey;
        let safe = false;
        while(!safe) {
            ex = Math.random() * (canvas.width - 50) + 25;
            ey = Math.random() * (canvas.height - 50) + 25;
            if (Math.hypot(ex - ball.x, ey - ball.y) > 200) safe = true; // Lejos del jugador
        }
        enemies.push({ x: ex, y: ey, radius: 8, vx: 2, vy: 2, history: [] });
    }
}

function checkCollision(circle, rect) {
    let closestX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.w));
    let closestY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.h));
    let distanceX = circle.x - closestX;
    let distanceY = circle.y - closestY;
    return {
        collision: (distanceX * distanceX) + (distanceY * distanceY) < (circle.radius * circle.radius),
        closestX, closestY
    };
}

function update() {
    if (!ball.active || gameOverAnim) return;

    bgHue += 0.1;
    
    // Física Bola
    ball.x += ball.vx; ball.y += ball.vy;
    ball.vx *= ball.friction; ball.vy *= ball.friction;
    
    // --- LÍMITES DE PANTALLA (NO SALIRSE) ---
    if (ball.x - ball.radius < 0) { ball.x = ball.radius; ball.vx *= -1; }
    if (ball.x + ball.radius > canvas.width) { ball.x = canvas.width - ball.radius; ball.vx *= -1; }
    if (ball.y - ball.radius < 0) { ball.y = ball.radius; ball.vy *= -1; }
    if (ball.y + ball.radius > canvas.height) { ball.y = canvas.height - ball.radius; ball.vy *= -1; }

    ball.history.push({x: ball.x, y: ball.y});
    if(ball.history.length > 8) ball.history.shift();

    if(isDragging) createParticles(currentTouch.x, currentTouch.y, "#a855f7", 2, 2);

    hole.angle += 0.05;
    if (Math.hypot(ball.x - hole.x, ball.y - hole.y) < hole.radius) {
        createParticles(ball.x, ball.y, "#fff", 30, 8);
        ball.active = false;
        score += 100; level++;
        if (playerName) db.ref('users/' + playerName).update({score: score});
        setTimeout(generateMaze, 800);
    }

    // Enemigos
    enemies.forEach(en => {
        en.x += en.vx; en.y += en.vy;
        en.history.push({x: en.x, y: en.y});
        if(en.history.length > 5) en.history.shift();
        
        // Colisión enemigo-pared
        obstacles.forEach(o => {
            let res = checkCollision(en, o);
            if (res.collision) {
                if (Math.abs(en.x - res.closestX) > Math.abs(en.y - res.closestY)) {
                    en.vx *= -1; en.x += en.vx;
                } else {
                    en.vy *= -1; en.y += en.vy;
                }
            }
        });

        // Colisión enemigo-jugador
        if (Math.hypot(en.x - ball.x, en.y - ball.y) < en.radius + ball.radius) {
            createParticles(ball.x, ball.y, "red", 20, 5);
            lives--;
            if (lives <= 0) triggerGameOver();
            else { 
                ball.x = ball.startX; ball.y = ball.startY; 
                ball.vx = 0; ball.vy = 0; 
                // Empujar enemigos lejos al reaparecer
                enemies.forEach(e => { e.x = Math.random()*canvas.width; e.y = Math.random()*canvas.height; });
            }
        }
    });

    // Colisión Jugador-Pared
    obstacles.forEach(o => {
        let res = checkCollision(ball, o);
        if (res.collision) {
            createParticles(ball.x, ball.y, "cyan", 3, 1);
            if (Math.abs(ball.x - res.closestX) > Math.abs(ball.y - res.closestY)) {
                ball.vx *= -0.8;
                ball.x = (ball.x < res.closestX) ? o.x - ball.radius - 1 : o.x + o.w + ball.radius + 1;
            } else {
                ball.vy *= -0.8;
                ball.y = (ball.y < res.closestY) ? o.y - ball.radius - 1 : o.y + o.h + ball.radius + 1;
            }
        }
    });

    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.life -= 0.02;
        if(p.life <= 0) particles.splice(i, 1);
    });
}

function triggerGameOver() {
    gameOverAnim = true;
    const go = document.getElementById('gameOverScreen');
    go.style.display = "flex";
    setTimeout(() => go.style.opacity = 1, 100);
    setTimeout(() => location.reload(), 3000);
}

function draw() {
    ctx.fillStyle = `hsla(${bgHue}, 30%, 5%, 1)`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    stars.forEach(s => {
        ctx.fillStyle = `rgba(255,255,255,${s.op})`;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    });

    ctx.shadowBlur = 10;
    ctx.shadowColor = `hsla(${bgHue}, 50%, 50%, 0.3)`;

    // Hoyo
    ctx.beginPath();
    let grad = ctx.createRadialGradient(hole.x, hole.y, 0, hole.x, hole.y, hole.radius);
    grad.addColorStop(0, "black");
    grad.addColorStop(1, "#4b0082");
    ctx.fillStyle = grad;
    ctx.arc(hole.x, hole.y, hole.radius * 1.5, 0, Math.PI*2);
    ctx.fill();

    // Paredes
    ctx.fillStyle = "#3b0764";
    obstacles.forEach(o => ctx.fillRect(o.x, o.y, o.w, o.h));

    // Partículas
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    ctx.globalAlpha = 1;

    // Línea de tiro (indicador visual de límite)
    if(isDragging && ball.active) {
        ctx.beginPath();
        ctx.moveTo(startTouch.x, startTouch.y);
        ctx.lineTo(currentTouch.x, currentTouch.y);
        ctx.strokeStyle = `rgba(168, 85, 247, ${Math.min(1, Math.hypot(startTouch.x-currentTouch.x, startTouch.y-currentTouch.y)/MAX_DRAG_DIST)})`;
        ctx.lineWidth = 3;
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    // Jugador
    if (ball.active) {
        ball.history.forEach((pos, i) => {
            ctx.fillStyle = `rgba(255,255,255,${i/10})`;
            ctx.beginPath(); ctx.arc(pos.x, pos.y, ball.radius * (i/8), 0, Math.PI*2); ctx.fill();
        });
        ctx.fillStyle = (playerName === topPlayerName && playerName !== "") ? `hsl(${Date.now()/10 % 360}, 100%, 70%)` : "white";
        ctx.shadowColor = ctx.fillStyle;
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2); ctx.fill();
    }

    // Enemigos
    enemies.forEach(en => {
        ctx.shadowColor = "red";
        ctx.fillStyle = "#ff4444";
        ctx.beginPath(); ctx.arc(en.x, en.y, en.radius, 0, Math.PI*2); ctx.fill();
    });

    ctx.shadowBlur = 0;
    document.getElementById('scoreDisplay').innerHTML = `NIVEL <span style="color:#a855f7">${level}</span> | PUNTOS <span style="color:#a855f7">${score}</span>`;
    document.getElementById('livesDisplay').innerHTML = `VIDAS: ${"❤️".repeat(lives)}`;
}

function handleAuth() {
    const name = document.getElementById('nameInput').value.trim();
    const pass = document.getElementById('passInput').value.trim();
    if (!name || !pass) return alert("Completa los campos");

    try {
        localStorage.setItem('novaBall_name', name);
        localStorage.setItem('novaBall_pass', pass);
    } catch (e) { console.warn("No se pudo guardar sesión"); }

    db.ref('users/' + name).once('value', snap => {
        const u = snap.val();
        if (u && u.password !== pass) return alert("Password incorrecto");
        if (!u) db.ref('users/' + name).set({password: pass, score: 0});
        
        playerName = name;
        score = (u && u.score) ? u.score : 0;
        menu.style.display = "none";
        document.getElementById('ui').style.display = "flex";
        generateMaze();
        loop();
    });
}

// --- CONTROL TÁCTIL CON LÍMITE DE FUERZA ---
canvas.addEventListener('touchstart', e => { 
    if(!ball.active) return;
    isDragging = true; 
    startTouch = {x: e.touches[0].clientX, y: e.touches[0].clientY}; 
    currentTouch = { ...startTouch };
}, {passive: false});

canvas.addEventListener('touchmove', e => { 
    if(!isDragging) return;
    let rawX = e.touches[0].clientX;
    let rawY = e.touches[0].clientY;
    
    // Cálculo vectorial para limitar la distancia visual
    let dx = rawX - startTouch.x;
    let dy = rawY - startTouch.y;
    let dist = Math.hypot(dx, dy);
    
    if (dist > MAX_DRAG_DIST) {
        let angle = Math.atan2(dy, dx);
        currentTouch.x = startTouch.x + Math.cos(angle) * MAX_DRAG_DIST;
        currentTouch.y = startTouch.y + Math.sin(angle) * MAX_DRAG_DIST;
    } else {
        currentTouch.x = rawX;
        currentTouch.y = rawY;
    }
}, {passive: false});

canvas.addEventListener('touchend', () => {
    if (!isDragging) return;
    // La fuerza se basa en la distancia limitada (currentTouch ya está limitado)
    let dx = startTouch.x - currentTouch.x;
    let dy = startTouch.y - currentTouch.y;
    
    ball.vx = dx * 0.12; // Ajuste de potencia
    ball.vy = dy * 0.12;
    isDragging = false;
});

function loop() { update(); draw(); requestAnimationFrame(loop); }
updateRanking();
</script>
